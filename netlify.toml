# Site SobreRodas no Netlify. Não há build a sério: copia-se a pasta data/ para junto do site.
[build]
  base = "/"
  publish = "site"
  command = "rm -rf site/data && cp -r data site/data"
  # Só publica quando o site muda ou na atualização diária dos dados (poupa as publicações do plano grátis).
  ignore = "bash scripts/netlify-ignore.sh"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# A app (PWA): o service worker tem de ser sempre revalidado para as atualizações chegarem.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
