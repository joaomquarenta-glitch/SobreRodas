name: Dados - atualização diária

on:
  schedule:
    - cron: "15 5 * * *"   # todos os dias às 05:15 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutos máximos para recuperar atraso"
        default: "30"

permissions:
  contents: write

concurrency:
  group: sobrerodas-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recolher dados
        run: python -m collector daily --minutes "${{ inputs.minutes || '30' }}"
      - name: Guardar dados no repositório
        run: scripts/commit-data.sh "Dados - atualização diária"
